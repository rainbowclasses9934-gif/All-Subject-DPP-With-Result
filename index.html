<!DOCTYPE html>
<html lang="hi">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>RAINBOW CLASSES - DPP Portal</title>
    <style>
        * { margin: 0; padding: 0; box-sizing: border-box; font-family: 'Segoe UI', system-ui, -apple-system, sans-serif; -webkit-tap-highlight-color: transparent; user-select: none; }
        input { user-select: auto; }
        body { background: linear-gradient(135deg, #0f172a 0%, #1e1b4b 50%, #311042 100%); color: #ffffff; min-height: 100vh; display: flex; flex-direction: column; align-items: center; background-attachment: fixed; }
        header { width: 100%; background: rgba(255, 255, 255, 0.05); backdrop-filter: blur(15px); -webkit-backdrop-filter: blur(15px); border-bottom: 1px solid rgba(255, 255, 255, 0.15); color: white; text-align: center; padding: 12px 15px; box-shadow: 0 4px 30px rgba(0, 0, 0, 0.3); }
        header h1 { font-size: 1.8rem; letter-spacing: 1px; font-weight: 800; background: linear-gradient(90deg, #38bdf8, #818cf8, #c084fc); -webkit-background-clip: text; -webkit-text-fill-color: transparent; }
        header p { font-size: 1.2rem; font-weight: bold; color: #cbd5e1; margin-top: 2px; }
        .container { width: 100%; max-width: 600px; padding: 20px 15px; margin-top: 10px; }
        .card { background: rgba(255, 255, 255, 0.08); backdrop-filter: blur(20px); -webkit-backdrop-filter: blur(20px); border: 1px solid rgba(255, 255, 255, 0.18); border-radius: 20px; padding: 25px; box-shadow: 0 10px 40px rgba(0, 0, 0, 0.4); margin-bottom: 20px; animation: fadeIn 0.4s ease-out; }
        @keyframes fadeIn { from { opacity: 0; transform: translateY(10px); } to { opacity: 1; transform: translateY(0); } }
        .input-group { margin-bottom: 18px; }
        .input-group label { display: block; font-weight: 600; margin-bottom: 8px; color: #e2e8f0; font-size: 0.95rem; }
        .input-group input { width: 100%; padding: 12px 16px; background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px; font-size: 1rem; color: #ffffff; outline: none; backdrop-filter: blur(5px); transition: all 0.3s; }
        .input-group input::placeholder { color: #94a3b8; }
        .input-group input:focus { border-color: #38bdf8; box-shadow: 0 0 15px rgba(56, 189, 248, 0.3); background: rgba(255, 255, 255, 0.12); }
        .glass-select-box { width: 100%; padding: 12px 16px; background: rgba(255, 255, 255, 0.07); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 12px; font-size: 1rem; color: #ffffff; cursor: pointer; backdrop-filter: blur(5px); transition: all 0.3s; display: flex; justify-content: space-between; align-items: center; }
        .glass-select-box:hover { border-color: #38bdf8; background: rgba(255, 255, 255, 0.12); }
        .select-icon { font-size: 0.8rem; color: #94a3b8; }
        .btn { width: 100%; background: linear-gradient(135deg, #06b6d4 0%, #3b82f6 100%); color: white; border: none; padding: 14px; border-radius: 12px; font-size: 1rem; font-weight: 600; cursor: pointer; transition: all 0.3s cubic-bezier(0.4, 0, 0.2, 1); box-shadow: 0 4px 15px rgba(6, 182, 212, 0.3); }
        .btn:hover { transform: translateY(-2px); box-shadow: 0 6px 20px rgba(6, 182, 212, 0.5); }
        .btn:active { transform: translateY(0); }
        .timer-box { font-size: 1rem; font-weight: 700; color: #f87171; background: rgba(239, 68, 68, 0.15); border: 1px solid rgba(239, 68, 68, 0.3); padding: 6px 14px; border-radius: 20px; display: inline-flex; align-items: center; gap: 6px; float: right; backdrop-filter: blur(5px); box-shadow: 0 0 10px rgba(239, 68, 68, 0.2); }
        .question-text { font-size: 1.15rem; font-weight: 600; margin-top: 40px; margin-bottom: 20px; clear: both; line-height: 1.6; color: #f8fafc; }
        .option-item { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.15); padding: 14px 16px; border-radius: 12px; margin-bottom: 12px; cursor: pointer; font-size: 0.98rem; color: #f1f5f9; transition: all 0.25s; backdrop-filter: blur(5px); }
        .option-item:hover { background: rgba(255, 255, 255, 0.12); border-color: rgba(255, 255, 255, 0.3); transform: translateX(4px); }
        .option-item.selected { background: rgba(16, 185, 129, 0.2); border-color: #34d399; box-shadow: 0 0 15px rgba(52, 211, 153, 0.3); font-weight: 600; color: #ffffff; }
        .nav-btns { display: flex; justify-content: space-between; gap: 12px; margin-top: 25px; }
        .nav-btns button { width: 48%; }
        .btn-prev { background: rgba(255, 255, 255, 0.12); color: #e2e8f0; border: 1px solid rgba(255, 255, 255, 0.2); box-shadow: none; }
        .btn-submit { background: linear-gradient(135deg, #10b981 0%, #059669 100%); box-shadow: 0 4px 15px rgba(16, 185, 129, 0.3); }
        .hidden { display: none !important; }
        .score-card { text-align: center; }
        .score-badge { font-size: 3rem; font-weight: 800; background: linear-gradient(90deg, #38bdf8, #34d399); -webkit-background-clip: text; -webkit-text-fill-color: transparent; margin: 20px 0; }
        .modal-overlay { position: fixed; top: 0; left: 0; width: 100%; height: 100%; background: rgba(0, 0, 0, 0.65); backdrop-filter: blur(8px); -webkit-backdrop-filter: blur(8px); display: flex; justify-content: center; align-items: center; z-index: 1000; animation: modalFade 0.3s ease-out; }
        .modal-glass { background: rgba(30, 27, 75, 0.85); backdrop-filter: blur(25px); -webkit-backdrop-filter: blur(25px); border: 1px solid rgba(255, 255, 255, 0.2); border-radius: 20px; padding: 30px; max-width: 400px; width: 88%; text-align: center; box-shadow: 0 20px 50px rgba(0, 0, 0, 0.6); animation: modalScale 0.3s cubic-bezier(0.175, 0.885, 0.32, 1.275); display: flex; flex-direction: column; }
        .options-glass { padding: 20px !important; max-height: 75vh; }
        .options-list { overflow-y: auto; max-height: 55vh; text-align: left; padding-right: 5px; margin-bottom: 10px; }
        .options-list::-webkit-scrollbar { width: 6px; }
        .options-list::-webkit-scrollbar-thumb { background: rgba(255,255,255,0.3); border-radius: 10px; }
        .option-card { background: rgba(255, 255, 255, 0.06); border: 1px solid rgba(255, 255, 255, 0.1); padding: 12px 15px; border-radius: 10px; margin-bottom: 8px; cursor: pointer; font-size: 0.95rem; color: #f1f5f9; transition: all 0.2s; }
        .option-card:hover { background: rgba(56, 189, 248, 0.2); border-color: #38bdf8; transform: translateX(4px); }
        .modal-icon { font-size: 2.5rem; margin-bottom: 12px; }
        .modal-glass p { font-size: 1.05rem; color: #f1f5f9; margin-bottom: 22px; line-height: 1.5; }
        @keyframes modalFade { from { opacity: 0; } to { opacity: 1; } }
        @keyframes modalScale { from { transform: scale(0.85); opacity: 0; } to { transform: scale(1); opacity: 1; } }
    </style>
</head>
<body>

    <header>
        <h1 id="main-title">RAINBOW CLASSES</h1>
        <p>DPP</p>
    </header>

    <div class="container">
        
        <div id="login-screen" class="card">
            <h2 style="margin-bottom: 20px; text-align: center; color: #f8fafc; font-size: 1.3rem;">छात्र विवरण भरें</h2>
            <div class="input-group">
                <label>विद्यार्थी का नाम:</label>
                <input type="text" id="student-name" placeholder="अपना नाम लिखें...">
            </div>
            <div class="input-group">
                <label>विद्यार्थी की आईडी:</label>
                <input type="text" id="student-id" placeholder="अपनी आईडी दर्ज करें...">
            </div>
            <button class="btn" onclick="verifyStudent()">Next</button>
        </div>

        <div id="selection-screen" class="card hidden">
            <h2 style="margin-bottom: 20px; text-align: center; color: #f8fafc; font-size: 1.3rem;">DPP सेटिंग्स</h2>
            <div class="input-group">
                <label>विषय चुनें (Class 12th):</label>
                <div class="glass-select-box" onclick="openSubjectSelect()">
                    <span id="subject-text">-- विषय चुनें --</span>
                    <span class="select-icon">▼</span>
                </div>
                <input type="hidden" id="subject-select" value="">
            </div>
            <div class="input-group">
                <label>अध्याय चुनें:</label>
                <div class="glass-select-box" onclick="openChapterSelect()">
                    <span id="chapter-text">-- पहले विषय चुनें --</span>
                    <span class="select-icon">▼</span>
                </div>
                <input type="hidden" id="chapter-select" value="">
            </div>
            <div class="input-group">
                <label>DPP चुनें:</label>
                <div class="glass-select-box" onclick="openQuizSelect()">
                    <span id="quiz-text">-- पहले अध्याय चुनें --</span>
                    <span class="select-icon">▼</span>
                </div>
                <input type="hidden" id="quiz-select" value="">
            </div>
            <button class="btn" onclick="startQuiz()">Start DPP</button>
        </div>

        <div id="quiz-screen" class="card hidden">
            <div>
                <span id="q-counter" style="font-weight: 600; color: #94a3b8; font-size: 0.95rem;">प्रश्न 1 / 10</span>
                <div class="timer-box">⏱️ <span id="time-left">10:00</span></div>
            </div>
            <div class="question-text" id="q-text">प्रश्न लोड हो रहा है...</div>
            <div id="options-container"></div>
            
            <div class="nav-btns">
                <button class="btn btn-prev" id="btn-prev" onclick="prevQuestion()">◄ पिछला</button>
                <button class="btn" id="btn-next" onclick="nextQuestion()">अगला ►</button>
            </div>
            <button class="btn btn-submit" id="btn-submit" style="margin-top: 12px; display: none;" onclick="submitQuiz()">सबमिट करें</button>
        </div>

        <div id="result-screen" class="card score-card hidden">
            <h2 style="color: #f8fafc; font-size: 1.5rem;">🎉 DPP समाप्त!</h2>
            <p id="res-name" style="margin-top: 10px; color: #cbd5e1; font-weight: 600; font-size: 1.1rem;"></p>
            <p id="res-id-display" style="color: #94a3b8; font-size: 0.9rem; margin-top: 5px;"></p>
            <div class="score-badge" id="res-score">0 / 0</div>
            <p id="res-percent" style="font-size: 1.25rem; font-weight: 700; color: #34d399;"></p>
            <br>
            <button class="btn" onclick="location.reload()">मुख्य पृष्ठ पर जाएँ</button>
        </div>

    </div>

    <div id="custom-modal" class="modal-overlay hidden">
        <div class="modal-glass">
            <div class="modal-icon">⚠️</div>
            <p id="modal-text">संदेश यहाँ दिखेगा</p>
            <button class="btn" style="padding: 10px;" onclick="closeModal()">ठीक है</button>
        </div>
    </div>

    <div id="options-modal" class="modal-overlay hidden">
        <div class="modal-glass options-glass">
            <h3 id="options-title" style="margin-bottom: 15px; color: #fff; font-size: 1.1rem;">चुनें</h3>
            <div id="options-list" class="options-list"></div>
            <button class="btn" style="padding: 10px; background: rgba(255,255,255,0.1); border: 1px solid rgba(255,255,255,0.2); box-shadow: none;" onclick="closeOptionsModal()">रद्द करें</button>
        </div>
    </div>

    <script src="questions.js"></script>

    <script>
        const subjectsList = {
            1: "भौतिक विज्ञान (Physics)",
            2: "रसायन विज्ञान (Chemistry)",
            3: "गणित (Mathematics)",
            4: "जीव विज्ञान (Biology)",
            5: "हिंदी (Hindi)",
            6: "अंग्रेज़ी (English)"
        };

        const chaptersData = {
            1: ["वैद्युत आवेश तथा क्षेत्र", "स्थिरवैद्युत विभव तथा धारिता", "विद्युत धारा", "गतिमान आवेश और चुंबकत्व", "चुंबकत्व एवं द्रव्य", "वैद्युतचुंबकीय प्रेरण", "प्रत्यावर्ती धारा", "वैद्युतचुंबकीय तरंगें", "किरण प्रकाशिकी एवं प्रकाशिक यंत्र", "तरंग - प्रकाशिकी", "विकिरण तथा द्रव्य की द्वैत प्रकृति", "परमाणु", "नाभिक", "अर्धचालक इलेक्ट्रॉनिकी", "संचार व्यवस्था"],
            2: ["ठोस अवस्था", "विलयन", "वैद्युत रसायन", "रासायनिक बलगतिकी", "पृष्ठ रसायन", "तत्त्वों के निष्कर्षण के सिद्धांत एवं प्रक्रम", "p-ब्लॉक के तत्त्व", "d- एवं f-ब्लॉक के तत्त्व", "उपसहसंयोजन यौगिक", "हैलोऐल्केन तथा हैलोऐरीन", "ऐल्कोहॉल, फ़ीनॉल एवं ईथर", "ऐल्डिहाइड, कीटोन एवं कार्बोक्सिलिक अम्ल", "ऐमीन", "जैव-अणु", "बहुलक", "दैनिक जीवन में रसायन"],
            3: ["संबंध एवं फलन", "प्रतिलोम त्रिकोणमितीय फलन", "आव्यूह", "सारणिक", "सांतत्य तथा अवकलनीयता", "अवकलज के अनुप्रयोग", "समाकलन", "समाकलनों के अनुप्रयोग", "अवकल समीकरण", "सदिश बीजगणित", "त्रि-विमीय ज्यामिति", "रैखिक प्रोग्रामन", "प्रायिकता"],
            4: ["जीवों में जनन", "पुष्पी पादपों में लैंगिक जनन", "मानव जनन", "जनन स्वास्थ्य", "वंशागति तथा विविधता के सिद्धांत", "वंशागति के आणविक आधार", "विकास", "मानव स्वास्थ्य तथा रोग", "खाद्य उत्पादन में वृद्धि की कार्यनीति", "मानव कल्याण में सूक्ष्म जीव", "जैव प्रौद्योगिकी - सिद्धांत व प्रक्रम", "जैव प्रौद्योगिकी एवं उसके उपयोग", "जीव और समष्टियां", "पारितंत्र", "जैव विविधता एवं संरक्षण", "पर्यावरण के मुद्दे"],
            5: ["बातचीत", "उसने कहा था", "संपूर्ण क्रांति", "अर्द्धनारीश्वर", "रोज", "एक लेख और एक पत्र", "ओ सदानीरा", "सिपाही की माँ", "प्रगीत और समाज", "जूठन", "हंसते हुए मेरा अकेलापन", "तिरछ", "शिक्षा", "कड़बक", "पद (सूरदास)", "पद (तुलसीदास)", "छप्पय", "कवित्त", "तुमुल कोलाहल कलह में", "पुत्र वियोग", "उषा", "जन-जन का चेहरा एक", "अधिनायक", "प्यारे नन्हें बेटे को", "हार-जीत", "गाँव का घर"],
            6: ["Indian Civilization and Culture", "Bharat is My Home", "A Pinch of Snuff", "I Have a Dream", "Ideas That Have Helped Mankind", "The Artist", "A Child is Born", "How Free is the Press", "The Earth", "India Through a Traveler's Eyes", "A Marriage Proposal", "Sweetest Love I Do Not Goe", "Song of Myself", "Now the Leaves Are Falling Fast", "Ode to Autumn", "An Epitaph", "The Soldier", "Macavity: The Mystery Cat", "Fire-Hymn", "Snake", "My Grandmother's House"]
        };

        let currentQuestions = [];
        let currentQIndex = 0;
        let userAnswers = [];
        let timerInterval;
        let timeLeft = 600;

        window.onload = function() {
            history.replaceState({ screen: 'login' }, '');
        };

        window.addEventListener('popstate', function(event) {
            const state = event.state;
            document.getElementById("custom-modal").classList.add("hidden");
            document.getElementById("options-modal").classList.add("hidden");

            if (!state) {
                showScreen('login-screen');
                return;
            }

            if (state.modal) document.getElementById("custom-modal").classList.remove("hidden");
            if (state.optionsModal) document.getElementById("options-modal").classList.remove("hidden");

            if (state.screen === 'login') {
                showScreen('login-screen');
                clearInterval(timerInterval);
            } else if (state.screen === 'selection') {
                showScreen('selection-screen');
                clearInterval(timerInterval);
            } else if (state.screen === 'quiz') {
                showScreen('quiz-screen');
            } else if (state.screen === 'result') {
                showScreen('result-screen');
            }
        });

        function showScreen(screenId) {
            document.getElementById("login-screen").classList.add("hidden");
            document.getElementById("selection-screen").classList.add("hidden");
            document.getElementById("quiz-screen").classList.add("hidden");
            document.getElementById("result-screen").classList.add("hidden");
            document.getElementById(screenId).classList.remove("hidden");
        }

        function verifyStudent() {
            let name = document.getElementById("student-name").value.trim();
            let studentId = document.getElementById("student-id").value.trim(); 

            if (!name) { showModal("कृपया अपना नाम लिखें!"); return; }
            if (!studentId) { showModal("कृपया अपनी आईडी दर्ज करें!"); return; }

            let isIdValid = false;
            let enteredIdLower = studentId.toLowerCase(); 

            if (window.validStudentIDs) {
                isIdValid = window.validStudentIDs.some(function(savedId) {
                    return savedId.toLowerCase() === enteredIdLower;
                });
            }

            if (!isIdValid) {
                showModal("आपकी आईडी पंजीकृत नहीं है! कृपया सही आईडी दर्ज करें।");
                return;
            }

            history.pushState({ screen: 'selection' }, '');
            showScreen('selection-screen');
        }

        function openSubjectSelect() {
            let list = document.getElementById("options-list");
            list.innerHTML = "";
            document.getElementById("options-title").innerText = "विषय चुनें";

            for (let key in subjectsList) {
                list.innerHTML += `<div class="option-card" onclick="selectSubject('${key}', '${subjectsList[key]}')">${subjectsList[key]}</div>`;
            }

            document.getElementById("options-modal").classList.remove("hidden");
            history.pushState({ screen: history.state ? history.state.screen : 'selection', optionsModal: true }, '');
        }

        function selectSubject(val, text) {
            document.getElementById("subject-select").value = val;
            document.getElementById("subject-text").innerText = text;
            
            document.getElementById("chapter-select").value = "";
            document.getElementById("chapter-text").innerText = "-- अध्याय चुनें --";
            document.getElementById("quiz-select").value = "";
            document.getElementById("quiz-text").innerText = "-- पहले अध्याय चुनें --";
            
            history.back();
        }

        function openChapterSelect() {
            let sub = document.getElementById("subject-select").value;
            if(!sub) {
                showModal("कृपया पहले विषय चुनें!");
                return;
            }

            let list = document.getElementById("options-list");
            list.innerHTML = "";
            document.getElementById("options-title").innerText = "अध्याय चुनें";

            let chapters = chaptersData[sub];
            for (let i = 0; i < chapters.length; i++) {
                let chNum = i + 1;
                list.innerHTML += `<div class="option-card" onclick="selectChapter('${chNum}', 'अध्याय ${chNum}: ${chapters[i]}')">अध्याय ${chNum}: ${chapters[i]}</div>`;
            }

            document.getElementById("options-modal").classList.remove("hidden");
            history.pushState({ screen: history.state ? history.state.screen : 'selection', optionsModal: true }, '');
        }

        function selectChapter(val, text) {
            document.getElementById("chapter-select").value = val;
            document.getElementById("chapter-text").innerText = text;
            history.back();
            loadQuizzesCustom();
        }

        function loadQuizzesCustom() {
            let sub = document.getElementById("subject-select").value;
            let chNum = document.getElementById("chapter-select").value;
            let qText = document.getElementById("quiz-text");
            document.getElementById("quiz-select").value = ""; 

            let hasQuizzes = false;
            if (window.quizDatabase && window.quizDatabase[sub] && window.quizDatabase[sub][`ch_${chNum}`]) {
                if(Object.keys(window.quizDatabase[sub][`ch_${chNum}`]).length > 0) {
                    hasQuizzes = true;
                }
            }

            if (hasQuizzes) {
                qText.innerText = "-- DPP चुनें --";
            } else {
                qText.innerText = "-- अभी कोई DPP उपलब्ध नहीं है --";
            }
        }

        function openQuizSelect() {
            let sub = document.getElementById("subject-select").value;
            let chNum = document.getElementById("chapter-select").value;
            
            if(!sub) { showModal("कृपया पहले विषय चुनें!"); return; }
            if(!chNum) { showModal("कृपया पहले अध्याय चुनें!"); return; }

            let list = document.getElementById("options-list");
            list.innerHTML = "";
            document.getElementById("options-title").innerText = "DPP चुनें";

            let hasQuizzes = false;

            if (window.quizDatabase && window.quizDatabase[sub] && window.quizDatabase[sub][`ch_${chNum}`]) {
                let quizzes = window.quizDatabase[sub][`ch_${chNum}`];
                
                if(Object.keys(quizzes).length > 0) {
                    hasQuizzes = true;
                    for (let qKey in quizzes) {
                        let qNum = qKey.replace("dpp_", "");
                        list.innerHTML += `<div class="option-card" onclick="selectQuiz('${qKey}', 'DPP-${qNum}')">DPP-${qNum}</div>`;
                    }
                }
            }

            if (!hasQuizzes) {
                list.innerHTML = `<div style="text-align:center; color:#94a3b8; padding: 20px;">अभी इस अध्याय में कोई DPP नहीं डाला गया है।<br><br>कृपया बाद में प्रयास करें।</div>`;
            }

            document.getElementById("options-modal").classList.remove("hidden");
            history.pushState({ screen: history.state ? history.state.screen : 'selection', optionsModal: true }, '');
        }

        function selectQuiz(val, text) {
            document.getElementById("quiz-select").value = val;
            document.getElementById("quiz-text").innerText = text;
            history.back();
        }

        function closeOptionsModal() {
            if (history.state && history.state.optionsModal) {
                history.back();
            } else {
                document.getElementById("options-modal").classList.add("hidden");
            }
        }

        function showModal(msg) {
            document.getElementById("modal-text").innerText = msg;
            document.getElementById("custom-modal").classList.remove("hidden");
            history.pushState({ screen: history.state ? history.state.screen : 'selection', modal: true }, '');
        }

        function closeModal() {
            if (history.state && history.state.modal) {
                history.back();
            } else {
                document.getElementById("custom-modal").classList.add("hidden");
            }
        }

        function startQuiz() {
            let sub = document.getElementById("subject-select").value;
            let ch = document.getElementById("chapter-select").value;
            let qKey = document.getElementById("quiz-select").value;

            if (!sub) { showModal("कृपया विषय चुनें!"); return; }
            if (!ch) { showModal("कृपया अध्याय चुनें!"); return; }
            if (!qKey) { showModal("कोई DPP चुना नहीं गया है। यदि उपलब्ध नहीं है, तो बाद में प्रयास करें।"); return; }

            const chKey = `ch_${ch}`;

            if (window.quizDatabase && window.quizDatabase[sub] && window.quizDatabase[sub][chKey] && window.quizDatabase[sub][chKey][qKey]) {
                currentQuestions = window.quizDatabase[sub][chKey][qKey];
                userAnswers = new Array(currentQuestions.length).fill(null);
                currentQIndex = 0;

                history.pushState({ screen: 'quiz' }, '');
                showScreen('quiz-screen');
                
                startOverallTimer();
                loadQuestion();
            } else {
                showModal("इस DPP के सवाल अभी जोड़े नहीं गए हैं!");
            }
        }

        function startOverallTimer() {
            clearInterval(timerInterval);
            timeLeft = 600; 
            updateTimerDisplay();

            timerInterval = setInterval(() => {
                timeLeft--;
                updateTimerDisplay();

                if (timeLeft <= 0) {
                    clearInterval(timerInterval);
                    showModal("समय समाप्त! आपका DPP स्वचालित रूप से सबमिट किया जा रहा है।");
                    submitQuiz();
                }
            }, 1000);
        }

        function updateTimerDisplay() {
            let m = Math.floor(timeLeft / 60);
            let s = timeLeft % 60;
            document.getElementById("time-left").innerText = `${m < 10 ? "0" + m : m}:${s < 10 ? "0" + s : s}`;
        }

        function loadQuestion() {
            let q = currentQuestions[currentQIndex];
            document.getElementById("q-counter").innerText = `प्रश्न ${currentQIndex + 1} / ${currentQuestions.length}`;
            document.getElementById("q-text").innerText = `${currentQIndex + 1}. ${q.question}`;

            let optsContainer = document.getElementById("options-container");
            optsContainer.innerHTML = "";

            q.options.forEach((opt, idx) => {
                let isSelected = userAnswers[currentQIndex] === idx ? "selected" : "";
                optsContainer.innerHTML += `<div class="option-item ${isSelected}" onclick="selectOption(${idx})">${String.fromCharCode(65+idx)}) ${opt}</div>`;
            });

            document.getElementById("btn-prev").style.visibility = currentQIndex === 0 ? "hidden" : "visible";
            if (currentQIndex === currentQuestions.length - 1) {
                document.getElementById("btn-next").style.display = "none";
                document.getElementById("btn-submit").style.display = "block";
            } else {
                document.getElementById("btn-next").style.display = "block";
                document.getElementById("btn-submit").style.display = "none";
            }
        }

        function selectOption(idx) {
            userAnswers[currentQIndex] = idx;
            loadQuestion();
        }

        function nextQuestion() {
            if (currentQIndex < currentQuestions.length - 1) {
                currentQIndex++;
                loadQuestion();
            }
        }

        function prevQuestion() {
            if (currentQIndex > 0) {
                currentQIndex--;
                loadQuestion();
            }
        }

        // ==========================================
        // SUBMIT QUIZ फंक्शन 
        // ==========================================
        function submitQuiz() {
            clearInterval(timerInterval);
            let score = 0;
            currentQuestions.forEach((q, idx) => {
                if (userAnswers[idx] === q.correct) score++;
            });

            let total = currentQuestions.length;
            let percent = Math.round((score / total) * 100);

            // गूगल शीट के लिए डाटा इकठ्ठा करना
            let studentName = document.getElementById("student-name").value;
            let studentId = document.getElementById("student-id").value;
            let subjectCode = document.getElementById("subject-select").value;
            let subjectName = document.getElementById("subject-text").innerText;
            let chapterName = document.getElementById("chapter-text").innerText;
            let dppName = document.getElementById("quiz-text").innerText;

            let sheetData = {
                name: studentName,
                id: studentId,
                score: `${score} / ${total}`,
                subjectCode: subjectCode,
                subjectName: subjectName,
                chapterName: chapterName,
                dppName: dppName
            };

            // =========================================================
            // आपका GOOGLE APPS SCRIPT का लिंक 
            // =========================================================
            const GOOGLE_SHEET_URL = 'https://script.google.com/macros/s/AKfycbxZVqprhQ_Y4pdg0xwRixDZUHavrTVDkdbMlprX6hCsqvAboITOaOVHBZYfCZO1O2yySw/exec'; 

            // keepalive: true का इस्तेमाल किया गया है ताकि टैब बंद होने पर भी डाटा चला जाए
            if(GOOGLE_SHEET_URL) {
                fetch(GOOGLE_SHEET_URL, {
                    method: 'POST',
                    keepalive: true, 
                    body: JSON.stringify(sheetData)
                }).catch(e => console.log("डेटा भेजने में त्रुटि: ", e));
            }

            // स्क्रीन पर रिजल्ट दिखाना
            history.replaceState({ screen: 'result' }, '');
            showScreen('result-screen');

            document.getElementById("res-name").innerText = `विद्यार्थी: ${studentName}`;
            document.getElementById("res-id-display").innerText = `ID: ${studentId}`;
            document.getElementById("res-score").innerText = `${score} / ${total}`;
            document.getElementById("res-percent").innerText = `कुल प्राप्तांक: ${percent}%`;
        }
    </script>
</body>
</html>
